unit_test:
  - name: unittest_fullmoon_matcher
    model: mart_fullmoon_reviews
    given:
      - input: ref('fct_reviews')
        rows:
          - {review_date: '2025-01-13'}
          - {review_date: '2025-01-14'}
          - {review_date: '2025-01-15'}
      - input: ref('seed_fullmoon_dates')
        rows:
          - {fullmoon_date: '2025-01-14'}
    expect:
      rows:
        - {review_date: '2025-01-13', is_fullmoon: "not full moon"}
        - {review_date: '2025-01-14', is_fullmoon: "not full moon"}
        - {review_date: '2025-01-15', is_fullmoon: "full moon"}